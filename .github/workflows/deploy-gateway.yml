name: Deploy gateway

on:
  push:
    branches: [main]
    paths:
      - gateway/**
      - extension/src/shared/**
      - .github/workflows/deploy-gateway.yml
  workflow_dispatch:

concurrency: deploy-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # wrangler.jsonc is ignored by git; fill the example's placeholders.
      - run: sed -e "s/<cloudflare-account-id>/$CLOUDFLARE_ACCOUNT_ID/" -e "s/<d1-database-id>/$D1_DATABASE_ID/" wrangler.example.jsonc > wrangler.jsonc
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm exec wrangler deploy
